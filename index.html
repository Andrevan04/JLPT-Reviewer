<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT Japanese Review | N5–N4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--bg:#e8edf5;--card:#ffffff;--ink:#1a2338;--mute:#5d6a85;--line:#cfd8e8;--accent:#2f56b5;--accent-ink:#fff;--soft:#dbe4f5;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2c;--card:#1d2840;--ink:#eaf0fb;--mute:#9aa8c6;--line:#324266;--accent:#8fb0f0;--accent-ink:#10192e;--soft:#2a3858;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a2c;--card:#1d2840;--ink:#eaf0fb;--mute:#9aa8c6;--line:#324266;--accent:#8fb0f0;--accent-ink:#10192e;--soft:#2a3858;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:460px;flex:1;display:flex;flex-direction:column;padding:14px 16px 16px;min-height:0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:1.05rem;font-weight:700;margin:0}
.count{font-size:.9rem;color:var(--mute)}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:12px}.seg button{font:inherit;font-weight:700;font-size:.9rem;padding:8px;border:0;border-radius:9px;background:none;color:var(--mute);cursor:pointer}.seg button.on{background:var(--card);color:var(--ink)}
.tabs{grid-template-columns:repeat(2,1fr)}
.stage{flex:1;min-height:0;perspective:1200px;display:flex}
.card{position:relative;flex:1;border:0;padding:0;background:none;font:inherit;color:inherit;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.back{transform:rotateY(180deg);gap:12px}
.kanji{font-family:"Zen Old Mincho","Noto Serif JP","Hiragino Mincho ProN",serif;font-weight:700;font-size:clamp(7rem,38vw,11rem);line-height:1}
.hint{position:absolute;bottom:16px;font-size:.8rem;color:var(--mute)}
.meaning{font-size:1.7rem;font-weight:700;line-height:1.25}
.read{width:100%;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline;text-align:left;border-top:1px solid var(--line);padding-top:18px}
.read dt{font-size:.85rem;color:var(--mute);margin:0}
.read dd{margin:0;font-size:1.25rem;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif}
.mini{font-family:"Zen Old Mincho",serif;font-size:2rem;color:var(--mute)}
.ex{width:100%;border-top:1px solid var(--line);padding-top:12px;text-align:left}.exw{font-family:"Zen Old Mincho","Noto Serif JP",serif;font-size:1.5rem;font-weight:700}.exr{display:flex;gap:10px;flex-wrap:wrap;font-size:.95rem;margin-top:2px}.exr span:last-child{color:var(--mute)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button.b{font:inherit;font-weight:700;font-size:1rem;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.b.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.tools button{font:inherit;font-size:.85rem;color:var(--mute);background:none;border:0;padding:8px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.done .kanji{font-size:5rem}
.done p{margin:0;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(10,16,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{width:100%;max-width:460px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.panel h2{margin:0 0 4px;font-size:1.1rem}
.panel label{font-size:.85rem;color:var(--mute);display:grid;gap:4px}
.panel input{font:inherit;font-size:1rem;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.err{color:#c0392b;font-size:.85rem;min-height:1.1em}
@media (prefers-color-scheme:dark){.err{color:#ff8f80}}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
body{align-items:stretch}
.wrap{max-width:1120px;margin:0 auto;padding:24px 28px 20px;width:100%}
header{margin-bottom:20px}
header .brand{display:grid;gap:2px}
h1{font-size:1.35rem;letter-spacing:-.02em}
.subtitle{font-size:.88rem;color:var(--mute)}
.count{white-space:nowrap}
.tabs{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px}
.seg button{white-space:nowrap}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.controls .seg{flex:1}
.view-switch{max-width:230px;grid-template-columns:repeat(2,1fr)}
.intro{margin:2px 0 14px}
.intro h2{font-size:1.1rem;margin:0 0 3px}
.intro p{font-size:.9rem;color:var(--mute);margin:0}
.stage{min-height:390px}
.face{gap:16px}
.learn-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:12px;overflow:auto;align-content:start;padding:2px;flex:1;min-height:0}
.study-item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px}
.study-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.study-word{font-family:"Zen Old Mincho","Noto Serif JP",serif;font-weight:700;font-size:2.1rem;line-height:1.15}
.study-reading{color:var(--mute);font-size:.95rem}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.04em;border-radius:20px;padding:4px 9px;background:var(--soft);white-space:nowrap}
.study-meaning{font-size:1.05rem;font-weight:700}
.study-detail{font-size:.87rem;color:var(--mute)}
.study-example{border-top:1px solid var(--line);padding-top:10px}
.study-example .exw{font-size:1.12rem}
.learn-search{font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%;margin-bottom:12px}
.empty{padding:38px 16px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.tools{margin-top:14px}
.learn-mode .tools #add,.learn-mode .tools #reset,.learn-mode .tools #shuf{display:none}
.modal-note{font-size:.8rem;color:var(--mute);margin:0}
@media(max-width:700px){.wrap{padding:15px 14px}.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.controls{gap:8px}.controls .seg{flex-basis:100%}.view-switch{max-width:none}.stage{min-height:360px}.learn-list{grid-template-columns:1fr}}
@media(max-width:700px){
  body.learn-mode{height:auto;min-height:100%;overflow-y:auto}
  .learn-mode .wrap{height:auto;min-height:100vh;flex:none}
  .learn-mode #main{flex:0 0 auto!important;min-height:0!important}
  .learn-mode .learn-list{overflow:visible;flex:none;min-height:auto;padding-bottom:12px}
}
@media(min-width:900px){.stage{min-height:480px}.face{padding:36px 56px}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand"><h1>JLPT Japanese Review</h1><span class="subtitle">A focused N5–N4 study space for kanji and everyday Japanese</span></div><span class="count" id="count"></span></header>
  <div class="seg tabs" id="tabs" role="group" aria-label="Study topic"><button data-m="kanji">Single Kanji</button><button data-m="combo">Combination Kanji</button><button data-m="adverb">Adverbs</button><button data-m="verbs">Verbs</button><button data-m="adj">Adjectives</button></div>
  <div class="controls">
    <div class="seg" id="seg" role="group" aria-label="JLPT level"><button data-l="n5">N5 only</button><button data-l="n4">N4 only</button><button data-l="all">N5 + N4</button></div>
    <div class="seg view-switch" id="viewSwitch" role="group" aria-label="Study style"><button data-view="review">Review</button><button data-view="learn">Learn</button></div>
  </div>
  <div class="intro"><h2 id="topicTitle"></h2><p id="topicDescription"></p></div>
  <input class="learn-search" id="search" type="search" placeholder="Search words, readings, or meanings" aria-label="Search study list" hidden>
  <div class="bar"><i id="bar"></i></div>
  <div id="main" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  <div class="tools">
    <button id="add">Add a card</button>
    <button id="shuf">Shuffle</button>
    <button id="reset">Start over</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2>Add a single kanji</h2>
    <p class="modal-note">Custom kanji are kept in your browser and included in both levels.</p>
    <label>Kanji<input id="fk" maxlength="2" autocomplete="off"></label>
    <label>Meaning<input id="fm" autocomplete="off"></label>
    <label>On’yomi (separate with commas)<input id="fo" autocomplete="off"></label>
    <label>Kun’yomi (separate with commas)<input id="fu" autocomplete="off"></label>
    <div class="err" id="err"></div>
    <div class="actions" style="margin-top:0">
      <button class="b" id="cancel">Cancel</button>
      <button class="b main" id="save">Save card</button>
    </div>
  </div>
</div>

});
var COMBINABLE_KANJI={};
BASE.concat(SINGLE_NOUNS).forEach(function(c){COMBINABLE_KANJI[c[0]]=true});
function isCombinationEntry(c){
  var kanji=(c[0].match(/[\u4e00-\u9fff々]/g)||[]);
  return kanji.length>=2&&kanji.every(function(k){return COMBINABLE_KANJI[k]});
}
COMBO=COMBO.filter(isCombinationEntry);
COMBO=COMBO.concat(VOCABS.filter(isCombinationEntry),COMBO_EXTRA.filter(isCombinationEntry));
var combinedSeen={};COMBO=COMBO.filter(function(c){if(combinedSeen[c[0]])return false;combinedSeen[c[0]]=true;return true});
VOCABS=[];
function build(){
  if(mode==="kanji"){
    known=load("kf-known",[]);
    deck=[];var seen={};BASE.concat(custom).forEach(function(c){if(!seen[c[0]]){seen[c[0]]=1;deck.push(c)}});
    SINGLE_NOUNS.forEach(function(c){if(!seen[c[0]]){seen[c[0]]=1;deck.push(c)}});
    var cust={};custom.forEach(function(c){cust[c[0]]=1});
    deck=deck.filter(function(c){
      if(cust[c[0]])return true;
      if(c[6]==="n5"||c[6]==="n4")return level==="all"||c[6]===level;
      var n5=N5.indexOf(c[0])>=0;
      return level==="all"||(level==="n5"?n5:!n5);
    });
  }else{
    var sources={verbs:VERBS,adj:ADJ,combo:COMBO,adverb:ADVERBS};
    var n5Words=mode==="combo"?N5_COMBO_WORDS:(mode==="verbs"?N5_VERB_WORDS:(mode==="adj"?N5_ADJ_WORDS:[]));
    deck=sources[mode].map(function(c){if(c.length<7)c[6]=n5Words.indexOf(c[0])>=0?"n5":"n4";return c})
      .filter(function(c){return level==="all"||c[6]===level});
    known=load(kkey(),[]);
  }
  queue=deck.filter(function(c){return known.indexOf(kf(c))<0});
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function itemLevel(c){return mode==="kanji"?(custom.some(function(x){return x[0]===c[0]})?"Custom":(c[6]==="n5"?"N5":(c[6]==="n4"?"N4":(N5.indexOf(c[0])>=0?"N5":"N4")))):(c[6]==="n5"?"N5":"N4")}
function studyItem(c){
  var kanji=mode==="kanji"&&c.length<7;
  var word=esc(c[0]),reading=kanji?"":'<div class="study-reading" lang="ja">'+esc(c[1])+'</div>';
  var meaning=kanji?c[1]:c[2];
  var details=kanji?'<div class="study-detail">On’yomi: <span lang="ja">'+esc(c[2]||"—")+'</span><br>Kun’yomi: <span lang="ja">'+esc(c[3]||"—")+'</span></div>':'<div class="study-detail">'+(mode==="verbs"?"Dictionary form: <span lang=\"ja\">"+esc(c[3]||"")+"</span><br>Verb group: Group "+verbGroup(c):esc(c[3]||""))+'</div>';
  var example=kanji?exHtml(c[0]):'<div class="study-example"><div class="exw" lang="ja">'+esc(c[4])+'</div><div class="exr"><span>'+esc(c[5])+'</span></div></div>';
  return '<article class="study-item"><div class="study-top"><div><div class="study-word" lang="ja">'+word+'</div>'+reading+'</div><span class="badge">'+itemLevel(c)+'</span></div><div class="study-meaning">'+esc(meaning)+'</div>'+details+example+'</article>';
}
function render(){
  var total=deck.length,done=total-queue.length;
  var m=$("main");
  if(studyView==="learn"){
    $("search").hidden=false;
    var query=$("search").value.trim().toLowerCase();
    var list=deck.filter(function(c){return !query||c.join(" ").toLowerCase().indexOf(query)>=0});
    $("count").textContent=list.length+" of "+total+" terms";
    $("bar").style.width=(total?done/total*100:0)+"%";
    m.innerHTML=list.length?'<div class="learn-list">'+list.map(studyItem).join("")+'</div>':'<div class="empty">No study items match that search.</div>';
    return;
  }
  $("search").hidden=true;
  $("count").textContent=done+" of "+total+" known";
  $("bar").style.width=(total?done/total*100:0)+"%";
  if(!queue.length){
    m.innerHTML='<div class="done"><div class="kanji">完</div><h2 style="margin:0">All '+total+' cards known</h2><p>Start over to go through the deck again.</p><button class="b main" id="again2">Start over</button></div>';
    $("again2").onclick=restart;return;
  }
  var c=queue[0];
  m.innerHTML='<div class="stage"><button class="card'+(flipped?' flip':'')+'" id="card" aria-label="Flashcard. Tap to flip.">'
   +'<div class="face"><div class="kanji" lang="ja"'+fs(c)+'>'+esc(c[0])+'</div><div class="hint">Tap to flip</div></div>'
   +'<div class="face back">'+(mode!=="kanji"?vHead(c):'<div class="mini" lang="ja">'+esc(c[0])+'</div><div class="meaning">'+esc(c[1])+'</div>')
   +(mode!=="kanji"?vRest(c):'<dl class="read"><dt>On’yomi</dt><dd lang="ja">'+esc(c[2]||"—")+'</dd><dt>Kun’yomi</dt><dd lang="ja">'+esc(c[3]||"—")+'</dd></dl>'+exHtml(c[0]))+'</div>'
   +'</button></div>'
   +'<div class="actions"><button class="b" id="again">Again</button><button class="b main" id="got">I know it</button></div>';
  $("card").onclick=flip;
  $("again").onclick=function(){next(false)};
  $("got").onclick=function(){next(true)};
}
function flip(){flipped=!flipped;var el=$("card");if(el)el.classList.toggle("flip",flipped)}
function next(ok){
  var c=queue.shift();
  if(ok){var kk=kf(c);if(known.indexOf(kk)<0)known.push(kk);save(kkey(),known)}
  else queue.push(c);
  flipped=false;render();
}
function restart(){known=known.filter(function(k){return !deck.some(function(c){return kf(c)===k})});save(kkey(),known);build();flipped=false;render()}
function shuffle(){
  for(var i=queue.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=queue[i];queue[i]=queue[j];queue[j]=t}
  flipped=false;render();
}

$("shuf").onclick=shuffle;
$("reset").onclick=restart;
$("add").onclick=function(){$("err").textContent="";$("sheet").classList.add("on");$("fk").focus()};
$("cancel").onclick=function(){$("sheet").classList.remove("on")};
$("sheet").onclick=function(e){if(e.target===$("sheet"))$("sheet").classList.remove("on")};
$("save").onclick=function(){
  var k=$("fk").value.trim(),m=$("fm").value.trim();
  if(!k||!m){$("err").textContent="Enter a kanji and its meaning.";return}
  if(BASE.concat(custom).some(function(c){return c[0]===k})){$("err").textContent="That kanji is already in the deck.";return}
  custom.push([k,m,$("fo").value.trim(),$("fu").value.trim()]);
  save("kf-custom",custom);
  ["fk","fm","fo","fu"].forEach(function(i){$(i).value=""});
  $("sheet").classList.remove("on");
  build();queue=queue.filter(function(c){return c[0]!==k});queue.unshift(deck[deck.length-1]);flipped=false;render();
};
document.addEventListener("keydown",function(e){
  if($("sheet").classList.contains("on"))return;
  if(e.key===" "||e.key==="Enter"){if(/^(BUTTON|INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;e.preventDefault();flip()}
  if(e.key==="ArrowRight"&&queue.length)next(true);
  if(e.key==="ArrowLeft"&&queue.length)next(false);
});
function paintSeg(){Array.prototype.forEach.call($("seg").children,function(b){var on=b.getAttribute("data-l")===level;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)})}
Array.prototype.forEach.call($("seg").children,function(b){b.onclick=function(){level=b.getAttribute("data-l");save("kf-level",level);$("search").value="";build();flipped=false;paintSeg();render()}});
var TOPICS={
  kanji:["Single kanji","Readings, meanings, and example vocabulary for each character."],
  combo:["Combination Kanji","Words formed by combining kanji from the Single Kanji set, with readings and examples."],
  adverb:["Adverbs","Frequency, time, degree, and manner words in context."],
  verbs:["Verbs","Verb meanings, dictionary forms, and example sentences."],
  adj:["Adjectives","Common descriptive words and example sentences."]
};
function paintTabs(){
  Array.prototype.forEach.call($("tabs").children,function(b){var on=b.getAttribute("data-m")===mode;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  $("add").style.display=mode==="kanji"&&studyView==="review"?"":"none";
  $("topicTitle").textContent=TOPICS[mode][0];
  $("topicDescription").textContent=TOPICS[mode][1]+" Level lists are study guides; JLPT does not publish a definitive vocabulary or kanji list.";
}
Array.prototype.forEach.call($("tabs").children,function(b){b.onclick=function(){mode=b.getAttribute("data-m");save("kf-mode",mode);$("search").value="";build();flipped=false;paintTabs();render()}});
Array.prototype.forEach.call($("viewSwitch").children,function(b){b.onclick=function(){studyView=b.getAttribute("data-view");save("kf-view",studyView);flipped=false;paintView();paintTabs();render()}});
function paintView(){
  Array.prototype.forEach.call($("viewSwitch").children,function(b){var on=b.getAttribute("data-view")===studyView;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
  document.body.classList.toggle("learn-mode",studyView==="learn");
}
$("search").oninput=render;
paintTabs();paintView();paintSeg();build();render();
</script>
</body>
</html>
